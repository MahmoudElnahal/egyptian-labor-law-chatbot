<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساعد قانون العمل المصري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f4; --panel:#fff; --ink:#1c1a17; --muted:#6b6459;
    --line:#e6e0d6; --accent:#8a6d3b; --accent-soft:#f3ece0;
    --user:#1f3a5f; --user-soft:#eaf0f7; --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#16150f; --panel:#1f1e17; --ink:#f0ece3; --muted:#a39b8c;
      --line:#332f26; --accent:#d4b483; --accent-soft:#2a251a;
      --user:#9dc0ea; --user-soft:#1c2430;
    }
  }
  :root[data-theme="dark"]{
    --bg:#16150f; --panel:#1f1e17; --ink:#f0ece3; --muted:#a39b8c;
    --line:#332f26; --accent:#d4b483; --accent-soft:#2a251a;
    --user:#9dc0ea; --user-soft:#1c2430;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Tajawal,system-ui,'Segoe UI',sans-serif;line-height:1.75;
    display:flex;flex-direction:column;height:100dvh}
  header{border-bottom:1px solid var(--line);background:var(--panel);
    padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:9px}
  .seal{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);
    border:1px solid var(--line);display:grid;place-items:center;font-size:15px}
  .status{margin-inline-start:auto;font-size:.76rem;color:var(--muted);
    display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:#b0a99c}
  .dot.on{background:#4c9a5f}

  main{flex:1;overflow-y:auto;padding:22px 16px}
  .wrap{max-width:820px;margin:0 auto}

  .intro{border:1px solid var(--line);background:var(--panel);
    border-radius:var(--radius);padding:20px}
  .intro h1{margin:0 0 6px;font-size:1.25rem}
  .intro p{margin:0 0 14px;color:var(--muted);font-size:.93rem}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink);
    border-radius:999px;padding:7px 14px;font:inherit;font-size:.85rem;cursor:pointer}
  .chip:hover{background:var(--accent-soft);border-color:var(--accent)}

  .msg{margin:18px 0;display:flex;gap:11px;align-items:flex-start}
  .avatar{width:29px;height:29px;border-radius:9px;flex:0 0 auto;display:grid;
    place-items:center;font-size:13px;border:1px solid var(--line)}
  .msg.user .avatar{background:var(--user-soft);color:var(--user)}
  .msg.bot .avatar{background:var(--accent-soft);color:var(--accent)}
  .bubble{flex:1;min-width:0}
  .msg.user .bubble{background:var(--user-soft);border-radius:var(--radius);
    padding:11px 15px;font-weight:500}
  .bubble p{margin:0 0 .75em}
  .bubble p:last-child{margin-bottom:0}
  .bubble ul,.bubble ol{margin:.4em 0 .8em;padding-inline-start:1.3em}
  .bubble li{margin-bottom:.3em}
  .bubble strong{color:var(--accent)}
  .cite{color:var(--accent);font-weight:500;font-size:.92em;white-space:nowrap}

  .sources{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .sources summary{cursor:pointer;color:var(--muted);font-size:.83rem;
    list-style:none;user-select:none}
  .sources summary::-webkit-details-marker{display:none}
  .sources summary::before{content:"▸ ";transition:.15s}
  .sources[open] summary::before{content:"▾ "}
  .src{border-inline-start:2px solid var(--line);padding:6px 11px;margin-top:9px;
    font-size:.84rem;color:var(--muted)}
  .src b{color:var(--ink);font-weight:500;display:block;margin-bottom:2px}

  .typing span{display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--muted);margin-inline-end:4px;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px}
  form{max-width:820px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}
  textarea{flex:1;resize:none;font:inherit;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:12px;padding:11px 14px;
    max-height:150px;min-height:46px}
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button.send{background:var(--accent);color:#fff;border:0;border-radius:12px;
    padding:0 20px;height:46px;font:inherit;font-weight:700;cursor:pointer}
  button.send:disabled{opacity:.45;cursor:default}
  .note{max-width:820px;margin:8px auto 0;font-size:.74rem;color:var(--muted);text-align:center}
  @media (max-width:600px){ main{padding:16px 12px} .intro{padding:16px} }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="seal">⚖️</span> مساعد قانون العمل المصري</div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">جارٍ التحقق…</span></div>
</header>

<main id="main">
  <div class="wrap" id="thread">
    <div class="intro" id="intro">
      <h1>اسأل في قانون العمل رقم 14 لسنة 2025</h1>
      <p>الإجابات مبنية على النص الرسمي للقانون وقراراته التنفيذية ولائحة تنظيم العمل — مع ذكر رقم المادة والصفحة في كل مرة.</p>
      <div class="chips">
        <button class="chip">إيه نص المادة 54؟</button>
        <button class="chip">كام يوم إجازة سنوية للعامل؟</button>
        <button class="chip">فصلوني من الشغل من غير سبب، أعمل إيه؟</button>
        <button class="chip">إجازة الوضع مدتها قد إيه؟</button>
        <button class="chip">مين اللي لازم يعمل لائحة تنظيم عمل؟</button>
        <button class="chip">فترة الاختبار أقصاها كام؟</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <form id="form">
    <textarea id="q" rows="1" placeholder="اكتب سؤالك… (Enter للإرسال، Shift+Enter لسطر جديد)"></textarea>
    <button class="send" id="send" type="submit">إرسال</button>
  </form>
  <div class="note">مساعد آلي للاسترشاد فقط — ليس بديلًا عن استشارة محامٍ أو عن النص المنشور في الجريدة الرسمية.</div>
</footer>

<script>
const thread = document.getElementById('thread');
const main = document.getElementById('main');
const form = document.getElementById('form');
const qEl = document.getElementById('q');
const sendBtn = document.getElementById('send');
let history = [];
let busy = false;

fetch('/api/health').then(r => r.json()).then(h => {
  document.getElementById('dot').classList.add('on');
  const bits = [h.chunks + ' مقطع'];
  bits.push(h.embeddings ? 'بحث هجين' : 'بحث لفظي');
  if (!h.openai) bits.push('بدون مفتاح OpenAI');
  document.getElementById('statusText').textContent = bits.join(' · ');
}).catch(() => document.getElementById('statusText').textContent = 'السيرفر مش شغال');

document.querySelectorAll('.chip').forEach(c =>
  c.addEventListener('click', () => { qEl.value = c.textContent; submit(); }));

qEl.addEventListener('input', () => {
  qEl.style.height = 'auto';
  qEl.style.height = Math.min(qEl.scrollHeight, 150) + 'px';
});
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
form.addEventListener('submit', e => { e.preventDefault(); submit(); });

function addMsg(role, html) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = `<div class="avatar">${role === 'user' ? '👤' : '⚖️'}</div><div class="bubble"></div>`;
  el.querySelector('.bubble').innerHTML = html;
  thread.appendChild(el);
  main.scrollTop = main.scrollHeight;
  return el.querySelector('.bubble');
}

// تنسيق خفيف: عريض، قوائم، فقرات، وتلوين الاستشهادات بالمواد
function render(text) {
  const esc = text.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const withCites = esc
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\((المادة[^)]*)\)/g, '<span class="cite">($1)</span>');
  return withCites.split(/\n{2,}/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^\s*[-•*]\s+/.test(l) || !l.trim())) {
      return '<ul>' + lines.filter(l => l.trim())
        .map(l => '<li>' + l.replace(/^\s*[-•*]\s+/, '') + '</li>').join('') + '</ul>';
    }
    if (lines.every(l => /^\s*\d+[.)]\s+/.test(l) || !l.trim())) {
      return '<ol>' + lines.filter(l => l.trim())
        .map(l => '<li>' + l.replace(/^\s*\d+[.)]\s+/, '') + '</li>').join('') + '</ol>';
    }
    return '<p>' + lines.join('<br>') + '</p>';
  }).join('');
}

function sourcesHtml(list) {
  if (!list || !list.length) return '';
  const items = list.map(s => {
    const head = [s['وثيقة'], s['عنوان']].filter(Boolean).join(' — ')
      + (s['صفحة'] ? ` (صفحة ${s['صفحة']})` : '');
    const body = (s['نص'] || '').slice(0, 320).replace(/[<>&]/g, '');
    return `<div class="src"><b>${head}</b>${body}…</div>`;
  }).join('');
  return `<details class="sources"><summary>المصادر (${list.length})</summary>${items}</details>`;
}

async function submit() {
  const question = qEl.value.trim();
  if (!question || busy) return;
  busy = true; sendBtn.disabled = true;
  document.getElementById('intro')?.remove();

  addMsg('user', render(question));
  qEl.value = ''; qEl.style.height = 'auto';
  const bubble = addMsg('bot', '<div class="typing"><span></span><span></span><span></span></div>');

  let answer = '', sources = [], first = true;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, history })
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const frames = buf.split('\n\n'); buf = frames.pop();
      for (const frame of frames) {
        const isSources = frame.startsWith('event: sources');
        const dataLine = frame.split('\n').find(l => l.startsWith('data: '));
        if (!dataLine) continue;
        const payload = JSON.parse(dataLine.slice(6));
        if (isSources) { sources = payload; continue; }
        if (payload.delta) {
          if (first) { bubble.innerHTML = ''; first = false; }
          answer += payload.delta;
          bubble.innerHTML = render(answer);
          main.scrollTop = main.scrollHeight;
        }
      }
    }
    bubble.innerHTML = render(answer) + sourcesHtml(sources);
    history.push({ role: 'user', content: question }, { role: 'assistant', content: answer });
    history = history.slice(-8);
  } catch (e) {
    bubble.innerHTML = render('حصل خطأ في الاتصال بالسيرفر: ' + e.message);
  }
  busy = false; sendBtn.disabled = false; qEl.focus();
  main.scrollTop = main.scrollHeight;
}
</script>
</body>
</html>
